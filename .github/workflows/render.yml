name: render

on:
  workflow_dispatch:
  push:
    branches: [quantum-entanglement-15min]

env:
  SHARDS: 12

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      chunks: ${{ steps.matrix.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: node deps
        run: npm install --no-audit --no-fund

      - name: python deps
        run: pip install numpy

      - name: Cache Piper and the Hindi voice
        uses: actions/cache@v4
        with:
          path: .piper
          key: piper-hi_IN-pratham-2023.11.14-2

      - name: Fetch Piper and the voice
        run: |
          mkdir -p .piper
          if [ ! -x .piper/piper/piper ]; then
            curl -fsSL -o .piper/piper.tar.gz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
            tar -xzf .piper/piper.tar.gz -C .piper
          fi
          ID=hi_IN-pratham-medium
          if [ ! -f .piper/$ID.onnx ]; then
            curl -fsSL -o .piper/$ID.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/pratham/medium/$ID.onnx"
            curl -fsSL -o .piper/$ID.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/pratham/medium/$ID.onnx.json"
          fi

      - name: Narration -> measured timings
        run: |
          python scripts/hinglish_voice.py --script narration.json --out public/audio \
            --piper .piper/piper/piper --voice .piper/hi_IN-pratham-medium.onnx \
            --manifest src/voice.json

      - name: Manifest from the measured audio
        run: python scripts/make_manifest.py

      - name: Foley
        run: python scripts/foley.py

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Shard matrix
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, math, sys
          manifest = json.load(open("src/manifest.json", encoding="utf-8"))
          last = manifest["scenes"][-1]
          total = int(last["start"] + last["dur"])   # exactly what <Composition durationInFrames> gets
          shards = int(os.environ["SHARDS"])
          size = math.ceil(total / shards)
          chunks = [{"index": i + 1, "start": i * size, "end": min((i + 1) * size - 1, total - 1)}
                    for i in range(shards) if i * size <= total - 1]
          print(f"measured total: {total} frames, {len(chunks)} shards", file=sys.stderr)
          print("chunks=" + json.dumps(chunks))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: film-input
          retention-days: 7
          path: |
            public/audio
            src/manifest.json
            src/voice.json

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 12
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: node deps
        run: npm install --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: film-input

      - name: Devanagari fonts
        run: |
          # Chapter titles are Devanagari; without a font that covers them the
          # headless browser draws empty boxes.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-lohit-deva || sudo apt-get install -y -qq fonts-noto-core
          fc-cache -f > /dev/null
          fc-list | grep -i -E "devanagari|lohit deva" | head -5
          fc-list | grep -qi -E "devanagari|lohit deva" || { echo "NO DEVANAGARI FONT — chapter titles would render as empty boxes"; exit 3; }

      - name: Render shard
        run: |
          mkdir -p out/chunks
          npx remotion render src/index.ts Film out/chunks/chunk-${{ matrix.chunk.index }}.mp4 \
            --frames=${{ matrix.chunk.start }}-${{ matrix.chunk.end }} \
            --concurrency=4 --log=info

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chunk-${{ matrix.chunk.index }}
          retention-days: 7
          path: out/chunks/chunk-${{ matrix.chunk.index }}.mp4

  stitch:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          merge-multiple: true
          path: out/chunks

      - name: Verify every shard is present
        run: |
          n=$(ls out/chunks/chunk-*.mp4 2>/dev/null | wc -l)
          [ "$n" -ge 1 ] || { echo "NO CHUNKS"; exit 2; }
          for i in $(seq 1 "$n"); do
            f=out/chunks/chunk-$i.mp4
            [ -s "$f" ] || { echo "MISSING $f"; exit 2; }
            echo "$f $(ffprobe -v error -show_entries format=duration -of csv=p=0 $f)"
          done
          echo "shards present: $n"

      - name: Stitch
        run: |
          # Numeric order, never shell glob order: chunk-10.mp4 sorts before
          # chunk-2.mp4, which silently scrambles the film's running order.
          n=$(ls out/chunks/chunk-*.mp4 | wc -l)
          for i in $(seq 1 "$n"); do echo "file 'chunk-$i.mp4'"; done > out/chunks/list.txt
          echo "concat order:"; cat out/chunks/list.txt
          ffmpeg -y -f concat -safe 0 -i out/chunks/list.txt -c copy -movflags +faststart out/video.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,nb_frames -of default=nw=1 out/video.mp4 | tee out/probe.txt
          ffmpeg -hide_banner -i out/video.mp4 -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume" | tee -a out/probe.txt

      - uses: actions/download-artifact@v4
        with:
          name: film-input

      - name: Frame count must match the manifest
        run: |
          python - <<'PY'
          import json, subprocess, sys
          want = json.load(open("src/manifest.json", encoding="utf-8"))["totalFrames"]
          got = int(subprocess.check_output([
              "ffprobe", "-v", "error", "-select_streams", "v:0", "-count_frames",
              "-show_entries", "stream=nb_read_frames", "-of", "csv=p=0", "out/video.mp4"]).strip())
          print(f"manifest frames {want}, stitched frames {got}")
          if got != want:
              sys.exit(f"FRAME COUNT MISMATCH: stitched {got} != manifest {want}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: film
          retention-days: 14
          path: |
            out/video.mp4
            out/probe.txt
