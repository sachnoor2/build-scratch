name: render

on:
  push:
    branches: [render-run]
  workflow_dispatch:
    inputs:
      seconds_per_frame:
        description: "Optional. Leave empty to benchmark on the runner."
        required: false
        default: ""

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Piper and the Hindi voice
        run: |
          mkdir -p .piper && cd .piper
          curl -fsSL -o piper.tar.gz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper.tar.gz
          ID=hi_IN-pratham-medium
          curl -fsSL -o $ID.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/pratham/medium/$ID.onnx"
          curl -fsSL -o $ID.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/pratham/medium/$ID.onnx.json"
      - name: Narration
        run: |
          pip install -q imageio-ffmpeg
          python scripts/hinglish_voice.py --script narration.json --out public/audio --piper .piper/piper/piper --voice .piper/hi_IN-pratham-medium.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: voice
          path: |
            public/audio
            src/manifest.json

  plan:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      spf: ${{ steps.spf.outputs.spf }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: voice
      - name: Shotlist from the measured voice
        run: python3 scripts/make_shotlist.py
      - name: Blender
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Build world
        run: blender -b -P scenes/build_world.py -- --out scenes/world.blend
      # Measure the cost here rather than trusting a typed-in number. plan_shards sizes every
      # shard to ~60 minutes from this, which is what keeps each job inside GitHub's 6-hour
      # limit even when the machine is slow.
      - name: Benchmark seconds per frame
        id: spf
        run: |
          s=$(date +%s)
          blender -b scenes/world.blend -P scenes/render.py -- \
            --camera cam-pair-wide --start 0 --end 5 --out public/out --samples 8 > /dev/null 2>&1
          e=$(date +%s)
          python3 scripts/record_bench.py --start "$s" --end "$e" --frames 6
          python3 scripts/read_bench.py >> "$GITHUB_OUTPUT"
      - id: plan
        run: |
          SPF="${{ inputs.seconds_per_frame }}"
          if [ -z "$SPF" ]; then
            SPF=$(python3 -c "import json;print(json.load(open('bench.json'))['secondsPerFrame'])")
          fi
          echo "sizing shards at ${SPF}s/frame"
          echo "shards=$(python3 scripts/plan_shards.py --seconds-per-frame "$SPF" --json)" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    # Gated on the commit message. 19,750 PNG frames is ~10 GB of artifacts against a 500 MB
    # quota, so the full film only renders when the push says [render]; otherwise this pipeline
    # runs voice + plan + benchmark, which is what tells us the real per-frame cost.
    if: contains(github.event.head_commit.message, '[render]')
    runs-on: ubuntu-latest
    # The 6-hour ceiling applies per job. plan_shards sizes each shard to ~60 min, so this is a
    # backstop rather than the operating limit.
    timeout-minutes: 350
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
      # raised from 4: at 4 in parallel the wall clock for a 13-minute film runs past a day.
      # Each job is still sized to ~60 minutes of work.
      max-parallel: 12
    steps:
      - uses: actions/checkout@v4
      - name: Blender
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Build world
        run: blender -b -P scenes/build_world.py -- --out scenes/world.blend
      - name: Render shard
        run: python3 scripts/render_shard.py --start ${{ matrix.shard.start }} --end ${{ matrix.shard.end }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frames-${{ matrix.shard.index }}
          path: public/out/frame_*.png
          if-no-files-found: warn

  assemble:
    needs: [voice, render]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          merge-multiple: true
          path: public/out
      - uses: actions/download-artifact@v4
        with:
          name: voice
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npx tsc --noEmit
      - run: python3 scripts/stitch.py
      - run: python3 scripts/qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/video.mp4
            qa.log
          if-no-files-found: error
          retention-days: 14
