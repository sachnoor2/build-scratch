name: render

on:
  push:
    branches: [quantum-3d-blender]
  workflow_dispatch:

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Piper and the Hindi voice
        run: |
          mkdir -p .piper && cd .piper
          curl -fsSL -o piper.tar.gz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper.tar.gz
          ID=hi_IN-pratham-medium
          curl -fsSL -o $ID.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/pratham/medium/$ID.onnx"
          curl -fsSL -o $ID.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/pratham/medium/$ID.onnx.json"
      - name: Narration at 1.2x, natural accent
        run: |
          pip install -q imageio-ffmpeg
          python scripts/hinglish_voice.py --script narration.json --out public/audio \
            --piper .piper/piper/piper --voice .piper/hi_IN-pratham-medium.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: voice
          path: |
            public/audio
            src/manifest.json

  plan:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: voice
      - name: Shotlist from the measured voice
        run: python3 scripts/make_shotlist.py
      - name: Blender
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Build world
        run: blender -b -P scenes/build_world.py -- --out scenes/world.blend
      # Measure, never guess. plan_shards sizes every shard to ~60 minutes from this number,
      # which is what keeps each job far inside GitHub's 6-hour limit.
      - name: Benchmark seconds per frame
        run: |
          s=$(date +%s)
          blender -b scenes/world.blend -P scenes/render.py -- \
            --camera cam-pair-wide --start 0 --end 5 --out public/out --samples 8 > /dev/null 2>&1
          e=$(date +%s)
          python3 scripts/record_bench.py --start "$s" --end "$e" --frames 6
      - id: plan
        run: |
          SPF=$(python3 -c "import json;print(json.load(open('bench.json'))['secondsPerFrame'])")
          echo "sizing shards at ${SPF}s/frame"
          echo "shards=$(python3 scripts/plan_shards.py --seconds-per-frame "$SPF" --json)" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    # Gated on the commit message so a documentation push does not start a 100+ hour render.
    if: contains(github.event.head_commit.message, '[render]')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
      max-parallel: 12
    steps:
      - uses: actions/checkout@v4
      - name: Blender and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y blender ffmpeg
      - name: Build world
        run: blender -b -P scenes/build_world.py -- --out scenes/world.blend
      - name: Render shard
        run: python3 scripts/render_shard.py --start ${{ matrix.shard.start }} --end ${{ matrix.shard.end }}
      # Frames travel as ONE mp4 per shard. 19,700 PNGs is ~10 GB against a 500 MB quota;
      # 138 shard videos are a few hundred MB and carry the same picture.
      - name: Encode shard
        run: |
          FPS=$(python3 -c "import json;print(json.load(open('brief.json'))['fps'])")
          START=${{ matrix.shard.start }}
          COUNT=$(( ${{ matrix.shard.end }} - ${{ matrix.shard.start }} + 1 ))
          ffmpeg -y -framerate "$FPS" -start_number "$START" -i public/out/frame_%06d.png \
            -frames:v "$COUNT" -c:v libx264 -crf 18 -pix_fmt yuv420p \
            public/out/shard_${{ matrix.shard.index }}.mp4
          rm -f public/out/frame_*.png
          ls -la public/out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard.index }}
          path: public/out/shard_${{ matrix.shard.index }}.mp4
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [voice, render]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
          path: public/out
      - uses: actions/download-artifact@v4
        with:
          name: voice
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npx tsc --noEmit
      - name: Verify coverage and stitch
        run: python3 scripts/stitch.py
      - name: Composite captions and audio
        run: npx remotion render src/index.ts Video out/video.mp4 --concurrency=3 --log=error
      - run: python3 scripts/qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/video.mp4
            qa.log
          if-no-files-found: error
          retention-days: 14
