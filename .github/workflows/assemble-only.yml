name: assemble-only

# Re-composites from shard artifacts that already exist, without re-rendering them.
# 180 shards is a night of Blender; a broken caption layer must never cost that again.
on:
  push:
    branches: [quantum-3d-blender]

jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[assemble]')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Read the source run
        run: |
          ID=$(python3 -c "import json;print(json.load(open('assemble.json'))['runId'])")
          echo "Assembling from run $ID"
          echo "RUN_ID=$ID" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # gh run download, not actions/download-artifact: the action's pattern download stopped at
      # 100 artifacts on a 180-shard run, and that failure looked exactly like missing frames.
      - name: Fetch shards and voice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public/out
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --pattern 'shard-*' --dir public/out
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name voice --dir .
          # gh extracts each artifact into its own folder; flatten so stitch sees one directory
          find public/out -name 'shard_*.mp4' -exec mv {} public/out/ \;
          find public/out -mindepth 1 -type d -empty -delete
          echo "shards on disk: $(ls public/out/shard_*.mp4 | wc -l)"
          echo "audio files: $(ls public/audio/*.wav | wc -l)"

      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npx tsc --noEmit
      - name: Verify coverage and stitch
        run: python3 scripts/stitch.py
      - name: Composite captions and audio
        run: npx remotion render src/index.ts Video out/video.mp4 --concurrency=3 --log=error
      - run: python3 scripts/qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/video.mp4
            qa.log
          if-no-files-found: error
          retention-days: 14
